# Pruebas: corre las pruebas unitarias, de integración y en navegador en cada
# cambio de main y en cada pull request. No usa la base de producción.
# Es el proceso real de los agentes de «Pruebas automatizadas» y «QA visual»
# del centro de operaciones (docs/EMPRESA.md).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hora de inicio
        run: echo "CI_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas unitarias y de integración
        run: npm test
      - name: Pruebas en navegador (Chrome del runner)
        run: npm run test:e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # Registro en AI Company HQ (solo en main): la corrida es la ejecución real de los
      # agentes «Pruebas automatizadas» y «QA visual», y cada commit con «HQ-Agent:» queda
      # como trabajo del agente indicado, con sus archivos. Si falla, no tumba las pruebas.
      - name: Registrar en AI Company HQ
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/hq.js record-ci
        env:
          CI_STATUS: ${{ job.status }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
